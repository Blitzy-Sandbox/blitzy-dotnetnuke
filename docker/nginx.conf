# MIGRATION: nginx config for the Angular 19 SPA, replacing the legacy DotNetNuke Windows/IIS
# server-rendered delivery (Website/ + release.config/web.config). This file is copied to
# /etc/nginx/conf.d/default.conf by docker/frontend.Dockerfile, so it contains ONLY a server block
# (it is included inside the stock image's http{} context). It serves the built SPA with HTML5
# history-API fallback, reverse-proxies /api to the ASP.NET Core 8 API container, and emits CSP +
# security headers (AAP §0.7.6).

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # Web root: docker/frontend.Dockerfile copies dist/dnn-migration-frontend/browser here.
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Compression ----
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    # ---- Security headers (AAP §0.7.6) ----
    # Declared ONLY at the server level. IMPORTANT nginx rule: add_header is inherited by a nested
    # location ONLY IF that location declares NO add_header of its own. The nested locations below
    # therefore use the `expires` directive (NOT add_header) for caching, so these security headers
    # are inherited by every response (static assets, index.html, and the SPA fallback alike).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- Reverse proxy: API ----
    # `^~` makes this prefix win over the static-asset regex location (so e.g. /api/...js is never
    # mis-routed to the file handler). NO trailing slash / URI on proxy_pass => nginx forwards the
    # ORIGINAL request URI unchanged, preserving the "/api" prefix that ASP.NET Core controllers are
    # routed under (/api/..., /api/v1/...). "api" resolves via the Docker Compose network DNS.
    location ^~ /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---- Long-cache hashed static assets ----
    # Uses `expires` only (no add_header) so the server-level security headers are still inherited.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp)$ {
        expires    1y;
        access_log off;
        try_files  $uri =404;
    }

    # ---- index.html must never be cached (new deploys are picked up immediately) ----
    # `expires -1` sets Cache-Control: no-cache without using add_header (preserves header inheritance).
    location = /index.html {
        expires -1;
    }

    # ---- SPA history-API fallback ----
    # Any unmatched path returns index.html so the Angular client-side router can resolve deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
