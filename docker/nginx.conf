# =============================================================================
# nginx.conf — Angular SPA static server + /api reverse proxy + CSP hardening
# Installed to /etc/nginx/conf.d/default.conf (server block; http{} is in the
# stock /etc/nginx/nginx.conf which includes conf.d/*.conf).
# =============================================================================

server {
    # MIGRATION (Finding CP-FINAL-9): listen on the unprivileged port 8080 so nginx can run as the
    # non-root `nginx` user (binding to ports < 1024 requires root). The container/compose port
    # mapping (host 4200 -> container 8080) and the reverse proxy are otherwise unchanged.
    listen      8080;
    listen      [::]:8080;
    server_name _;

    # Do not disclose the nginx version in the Server response header or on error pages
    # (Finding CP5 LOW — information disclosure / version disclosure hardening).
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # ----- gzip -----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml application/wasm;

    # ----- security headers (XSS hardening / CSP) -----
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block" always;

    client_max_body_size 25m;

    # ----- API reverse proxy (preserve /api prefix; do NOT add a trailing slash) -----
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ----- hashed static assets: long cache -----
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";

        # MIGRATION (Finding CP-FINAL-F5 INFO — static-asset security-header gap): nginx does NOT
        # inherit `add_header` directives from an outer block once the current block declares ANY
        # `add_header` of its own (see nginx ngx_http_headers_module inheritance semantics). Because
        # this block sets its own Cache-Control above, the five server-level security headers
        # (CSP/nosniff/DENY/Referrer-Policy/XSS) would otherwise be DROPPED on .js/.css/font/image
        # responses. We therefore re-declare them here (verbatim, with `always`) so every static
        # asset carries the same hardening as the SPA `/` and proxied `/api/` surfaces. Keep these
        # in sync with the server-level block above.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection       "1; mode=block" always;

        try_files  $uri =404;
    }

    # ----- SPA fallback routing -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
