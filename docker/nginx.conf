# =============================================================================
# nginx.conf — Angular SPA static server + /api reverse proxy + CSP hardening
# Installed to /etc/nginx/conf.d/default.conf (server block; http{} is in the
# stock /etc/nginx/nginx.conf which includes conf.d/*.conf).
# =============================================================================

server {
    # Unprivileged port: this server runs under the non-root "nginx" user (uid 101)
    # in the nginxinc/nginx-unprivileged base image, which cannot bind to ports < 1024.
    listen      8080;
    listen      [::]:8080;
    server_name _;

    # ----- suppress server-version disclosure -----
    # Hide the nginx version (and the "nginx" product token) from the Server response
    # header and from generated error pages, so the deployment does not advertise the
    # exact server version to clients/attackers.
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # ----- gzip -----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml application/wasm;

    # ----- security headers (XSS hardening / CSP) -----
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block" always;

    client_max_body_size 25m;

    # ----- API reverse proxy (preserve /api prefix; do NOT add a trailing slash) -----
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ----- hashed static assets: long cache -----
    # MIGRATION (F5-02 hardening): nginx resolves `add_header` at only ONE level — the most specific
    # block that declares ANY `add_header` directive. Because this location declares its own
    # Cache-Control header, it would OTHERWISE suppress inheritance of the server-scope security
    # headers above and drop them from .js/.css/font/img responses AND asset-path 404s. We therefore
    # RE-DECLARE all five security headers here (each with `always`, so they are emitted on 404
    # responses too), keeping them byte-identical to the server-scope declarations, alongside the
    # long-lived immutable cache policy (`expires` alone would NOT emit `immutable`).
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection       "1; mode=block" always;
        try_files  $uri =404;
    }

    # ----- SPA fallback routing -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
