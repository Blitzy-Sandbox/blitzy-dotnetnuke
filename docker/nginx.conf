events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide the nginx version from the "Server" response header and error pages
    # (information-disclosure hardening).
    server_tokens off;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security response headers applied to responses served by this server.
        # The `always` parameter ensures they are emitted on error responses
        # (e.g. 4xx/5xx) too, not only on 2xx/3xx.
        #
        # IMPORTANT (nginx add_header inheritance): add_header directives are
        # inherited from an outer block ONLY when the inner block declares no
        # add_header of its own. The static-asset location below declares its own
        # Cache-Control add_header, which would suppress inheritance of these
        # security headers — so they are intentionally re-declared there as well.
        #
        # CSP notes: 'unsafe-inline' is required in style-src because Angular
        # injects component styles as inline <style> elements at runtime; scripts
        # remain 'self' only (AOT production build needs no inline/eval scripts).
        # connect-src 'self' covers the same-origin /api/ proxy below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Re-declared because this location's own add_header (Cache-Control)
            # suppresses inheritance of the server-level security headers above.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        }
    }
}
