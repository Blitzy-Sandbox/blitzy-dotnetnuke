version: "3.8"

# =============================================================================
# docker-compose.yml — two-container topology (api + frontend) for Linux.
# Run from the docker/ directory:  docker-compose build  &&  docker-compose up -d
# Build context is the repository root (..), so Dockerfile COPY paths are
# repo-root-relative (backend/..., frontend/..., docker/nginx.conf).
# =============================================================================

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: dnnmigration-api:latest
    container_name: dnnmigration-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      # Real values injected from the host environment; defaults are NON-SECRET placeholders.
      ConnectionStrings__Default: "${ConnectionStrings__Default:-Server=host.docker.internal,1433;Database=DotNetNuke;User Id=sa;Password=Change_This_Pwd_123;TrustServerCertificate=True;MultipleActiveResultSets=True}"
      Jwt__Key: "${Jwt__Key:-CHANGE_ME_DnnMigration_Production_Signing_Key_min_32_chars_0123456789}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dnn-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: dnnmigration-frontend:latest
    container_name: dnnmigration-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dnn-network

networks:
  dnn-network:
    driver: bridge
