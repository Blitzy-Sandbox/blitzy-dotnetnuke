# MIGRATION: docker-compose topology for the migrated stack — the ASP.NET Core 8 BFF Web API
# (replacing DotNetNuke.dll on Windows/IIS) plus the Angular 19 SPA served by nginx. Replaces the
# legacy single-assembly IIS deployment configured under Website/ (release.config / web.config).
# Build context for BOTH services is the repository ROOT (context: ..), since this file lives in docker/.
#
# Bring up:  cd docker && docker-compose up -d --build
# Validate (Gate 7):  curl -f http://localhost:8080/health  -> 200
#                     curl -f http://localhost:4200         -> 200
#
# SECRETS (CWE-798): the DB connection string and JWT signing key are injected via environment variables
# and have NO committed fallback defaults. Supply them via a local docker/.env file (copy from
# docker/.env.example) or a secrets manager (export CONNECTION_STRING=... JWT_SECRET=...). Never commit
# a real .env / real secrets. If unset, the API fail-fasts at startup by design (Program.cs Jwt:Key check).
#
# TOPOLOGY (local / Gate 7 — NOT a production descriptor): this compose serves the SPA and API over plain
# HTTP on the loopback interface (localhost:4200 -> frontend container :8080, localhost:8080 -> api :8080)
# for local development and the Gate-7 smoke test. In PRODUCTION, TLS is TERMINATED UPSTREAM at the
# platform edge (ingress controller / cloud load balancer / reverse proxy) — the same model the API
# runtime assumes (docker/api.Dockerfile: "HTTPS is terminated upstream"; Kestrel listens HTTP :8080).
# The SPA's nginx (docker/nginx.conf) emits a Strict-Transport-Security (HSTS) header that the browser
# honors once responses are delivered over that upstream HTTPS edge. To deploy, place these services
# behind a TLS-terminating ingress pointed at the published frontend (4200->8080) and api (8080) ports.
name: dnnmigration

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: dnnmigration-api:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      # MIGRATION: [Security CWE-798] No committed fallback secrets. CONNECTION_STRING and JWT_SECRET are
      # REQUIRED at runtime and have NO usable defaults — supply them via a local docker/.env file (copy
      # docker/.env.example) or your orchestrator's secret store. If unset they interpolate to empty and
      # the API fail-fasts at startup (Program.cs requires a non-empty, >=32-byte Jwt:Key), which is the
      # intended secure default. Build (Gate 6) does not need these; they are applied only at `up` time.
      ConnectionStrings__DefaultConnection: "${CONNECTION_STRING}"
      Jwt__Key: "${JWT_SECRET}"
      Jwt__Issuer: "DnnMigration"
      Jwt__Audience: "DnnMigrationClient"
      # CORS allowed SPA origin is NOT a secret; a local default is fine and is overridable for production.
      Cors__AllowedOrigins__0: "${CORS_ORIGIN:-http://localhost:4200}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - dnnmigration
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: dnnmigration-frontend:latest
    ports:
      # Host 4200 -> container 8080. The frontend image is nginxinc/nginx-unprivileged, whose worker
      # runs as the non-root nginx user (uid 101) and binds the unprivileged port 8080. Gate 7's
      # `curl http://localhost:4200` exercises the host-published port, unchanged.
      - "4200:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dnnmigration
    restart: unless-stopped

networks:
  dnnmigration:
    driver: bridge
