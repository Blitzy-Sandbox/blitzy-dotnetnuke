# =============================================================================
# docker-compose.yml — two-container topology (api + frontend) for Linux.
# Run from the docker/ directory:  docker-compose build  &&  docker-compose up -d
# Build context is the repository root (..), so Dockerfile COPY paths are
# repo-root-relative (backend/..., frontend/..., docker/nginx.conf).
#
# The top-level `version` key is intentionally omitted: it is obsolete under the
# modern Compose Specification (Docker treats it as informative-only and warns
# when present). Secrets are REQUIRED at runtime and have NO insecure defaults —
# `ConnectionStrings__Default` and `Jwt__Key` MUST be supplied by the host
# environment (or a local .env file; see docker/.env.example). The `:?` required
# interpolation aborts `docker-compose up`/`build` with an explanatory error when
# a value is missing, rather than silently booting with a known credential.
# =============================================================================

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: dnnmigration-api:latest
    container_name: dnnmigration-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      # REQUIRED secrets — supplied ONLY from the host environment (or a local .env file; see
      # docker/.env.example). The `:?` form aborts startup with the given message if the variable is
      # unset or empty, so the Production container can NEVER boot with a baked-in default credential or
      # signing key. (Jwt__Key must be >= 32 bytes; Program.cs fail-fasts otherwise.)
      ConnectionStrings__Default: "${ConnectionStrings__Default:?ConnectionStrings__Default is required (set it in the host environment or docker/.env)}"
      Jwt__Key: "${Jwt__Key:?Jwt__Key is required and must be at least 32 bytes (set it in the host environment or docker/.env)}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dnn-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: dnnmigration-frontend:latest
    container_name: dnnmigration-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dnn-network

networks:
  dnn-network:
    driver: bridge
