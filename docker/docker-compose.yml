# =============================================================================
# docker-compose.yml — two-container topology (api + frontend) for Linux.
# NOTE: the top-level `version` key is intentionally omitted — it is obsolete and
# ignored by Docker Compose v2 (Finding CP5 INFO — compose hygiene).
# Run from the docker/ directory:  docker-compose build  &&  docker-compose up -d
# Build context is the repository root (..), so Dockerfile COPY paths are
# repo-root-relative (backend/..., frontend/..., docker/nginx.conf).
# =============================================================================

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: dnnmigration-api:latest
    container_name: dnnmigration-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      # MIGRATION (Finding CP-FINAL-1): REQUIRED secrets — NO in-file defaults. The `${VAR:?msg}` form
      # makes `docker compose config`/`up` FAIL FAST when the variable is unset or empty, so a deployment
      # can never silently start with a known/placeholder DB password or JWT signing key (CWE-798).
      # Inject these from the host environment or a secret store (e.g. an .env file, `--env-file`, or
      # Docker/Swarm secrets) at deploy time.
      ConnectionStrings__Default: "${ConnectionStrings__Default:?ConnectionStrings__Default is required (provide via host environment or secret store; no default is shipped)}"
      Jwt__Key: "${Jwt__Key:?Jwt__Key is required and must be at least 32 characters (provide via host environment or secret store; no default is shipped)}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dnn-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: dnnmigration-frontend:latest
    container_name: dnnmigration-frontend
    restart: unless-stopped
    ports:
      # MIGRATION (Finding CP-FINAL-9): the nginx runtime now listens on the unprivileged port 8080
      # so it can run as the non-root `nginx` user. Host port 4200 is preserved (Gate 7 target).
      - "4200:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dnn-network

networks:
  dnn-network:
    driver: bridge
