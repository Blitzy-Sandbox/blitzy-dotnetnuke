<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DNN Migration</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    Pre-bootstrap loading splash (QA F17). This markup lives inside <app-root> and is
    discarded by Angular the moment it bootstraps and renders the real app shell.
    The styles below are INTENTIONALLY self-contained literals rather than the
    src/styles.scss design tokens (var(--color-*)): the global stylesheet's :root
    custom properties are not guaranteed to be applied at the very first paint
    (in dev the styles bundle is injected by JS after the document parses), so the
    splash must not depend on them. The literal values mirror the authoritative
    tokens exactly: bg #f4f6f9 (--color-bg), text #1f2933 (--color-text),
    border #d7dde5 (--color-border), accent #1565c0 (--color-primary),
    system font stack (--font-family-base), body 0.875rem (--font-size).
  -->
  <style>
    .app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 0;
      background: #f4f6f9;
      color: #1f2933;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
    }
    .app-loading__spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid #d7dde5;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }
    .app-loading__label {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    @keyframes app-loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-loading__spinner {
        animation-duration: 1.6s;
      }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-loading" role="status" aria-live="polite">
      <div class="app-loading__spinner" aria-hidden="true"></div>
      <div class="app-loading__label">Loading DNN Migration…</div>
    </div>
  </app-root>
  <noscript>You need JavaScript enabled to run this app.</noscript>
</body>
</html>
