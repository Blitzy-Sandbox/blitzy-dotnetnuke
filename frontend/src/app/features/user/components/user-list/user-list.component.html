<!--
  user-list.component.html — template for the standalone <app-user-list> screen.

  MIGRATION: reproduces Website/admin/Users/Users.ascx.vb (+ ManageUsers.ascx.vb)
  with UI functional parity (AAP §0.3.4 / §0.7.1): letter + special filters
  (All / A-Z / None / Unauthorized / OnLine), search by Username / Email / Profile,
  server paging, online/authorized/locked indicators, and per-row Edit / Roles /
  Delete commands. The component (user-list.component.ts) is the DATA OWNER and
  re-queries UserService on every grid event; the grid, spinner and confirmation
  dialog are delegated to shared blocks. RBAC gating (AAP §0.3.4): the page-level
  "Add New User" affordance is gated by the EDIT permission via *appHasPermission
  (parity with the portal/module/role lists), and the per-row Edit/Roles/Delete
  commands are gated inside the shared data-table by each action's permission key
  (EDIT for Edit/Roles, DELETE for Delete). Authoritative authorization remains
  server-side; this only gates the UI affordance (superusers are always granted).
-->
<section class="user-list" aria-labelledby="user-list-heading">
  <header class="user-list__header">
    <h1 id="user-list-heading" class="user-list__title">Users</h1>
    <button
      *appHasPermission="'EDIT'"
      type="button"
      class="user-list__new"
      (click)="onCreate()"
    >
      Add New User
    </button>
  </header>

  @if (error(); as message) {
    <div class="user-list__banner user-list__banner--error" role="alert">
      <span class="user-list__banner-text">{{ message }}</span>
      <button
        type="button"
        class="user-list__banner-close"
        aria-label="Dismiss error"
        (click)="dismissError()"
      >
        &times;
      </button>
    </div>
  }

  @if (loading()) {
    <app-loading-spinner [loading]="true" message="Loading users…" />
  } @else if (!error()) {
    <!--
      QA FINAL_ALT M4: when a list load FAILS, the data-table (and its
      "No users found." empty placeholder) is suppressed so the error and
      empty states stay mutually exclusive — the failed load must not imply
      the user database is empty. The error banner above (role="alert") is
      the sole visible state on failure.
    -->
    <app-data-table
      [rows]="rows()"
      [columns]="columns"
      [actions]="actions"
      [meta]="meta()"
      [filters]="filters"
      [activeFilter]="activeFilter()"
      [searchable]="true"
      [searchTypes]="searchTypes"
      [searchText]="searchText()"
      label="Users"
      searchPlaceholder="Search users"
      emptyMessage="No users found."
      (filterChange)="onFilterChange($event)"
      (searchChange)="onSearchChange($event)"
      (pageChange)="onPageChange($event)"
      (rowClick)="onRowClick($event)"
      (actionClick)="onActionClick($event)"
    />
  }

  <app-confirmation-dialog
    [open]="deleteTarget() !== null"
    title="Delete User"
    [message]="deleteMessage()"
    confirmText="Delete"
    (confirm)="onDeleteConfirm()"
    (cancel)="onDeleteCancel()"
  />
</section>
