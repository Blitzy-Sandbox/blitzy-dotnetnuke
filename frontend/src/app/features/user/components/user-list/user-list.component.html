<section class="user-list">
  <header class="user-list__header">
    <h1 class="user-list__title">Users</h1>
    <button type="button" class="user-list__add" (click)="onCreate()">Add User</button>
  </header>

  <!--
    MIGRATION (QA Finding D): RFC 7807 error surfaced as a dismissible alert banner so a server
    failure (e.g. a 503 when the database is unreachable) is NEVER silently swallowed and rendered
    as the "No users found." empty state. role="alert" + aria-live="assertive" announces it to
    assistive technology. Mirrors the module-list / role-list error banner.
  -->
  @if (error(); as err) {
    <div class="user-list__banner user-list__banner--error" role="alert" aria-live="assertive">
      <span class="user-list__banner-text">{{ err }}</span>
      <button
        type="button"
        class="user-list__banner-dismiss"
        aria-label="Dismiss error"
        (click)="dismissError()">
        &times;
      </button>
    </div>
  }

  <app-data-table
    [rows]="rows()"
    [columns]="columns"
    [actions]="actions"
    [meta]="meta()"
    [filters]="filters"
    [activeFilter]="activeFilter()"
    [searchable]="true"
    [searchTypes]="searchTypes"
    [searchText]="searchText()"
    [loading]="loading()"
    caption="Users"
    [emptyMessage]="error() ? '' : 'No users found.'"
    searchButtonLabel="Search"
    (rowClick)="onRowClick($event)"
    (filterChange)="onFilterChange($event)"
    (searchChange)="onSearchChange($event)"
    (pageChange)="onPageChange($event)"
    (actionClick)="onActionClick($event)">
  </app-data-table>

  @if (loading()) {
    <app-loading-spinner message="Loading users..."></app-loading-spinner>
  }

  <app-confirmation-dialog
    [open]="deleteTarget() !== null"
    title="Delete User"
    [message]="deleteMessage()"
    confirmText="Delete"
    cancelText="Cancel"
    (confirm)="onDeleteConfirm()"
    (cancel)="onDeleteCancel()">
  </app-confirmation-dialog>
</section>
