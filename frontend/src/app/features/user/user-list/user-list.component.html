<section class="user-list">
  <header class="user-list__header">
    <h1 class="user-list__title">Users</h1>
    <button type="button" class="user-list__add" (click)="onAddUser()">Add New User</button>
  </header>

  <!-- MIGRATION: legacy Users.ascx search table (txtSearch + ddlSearchType + btnSearch).
       The A-Z letter bar (plLetterSearch) is intentionally omitted (subsumed by prefix search;
       see MIGRATION_NOTES.md). Uses template refs instead of FormsModule/ngModel. -->
  <div class="user-list__search" role="search">
    <label class="user-list__search-label" for="user-search-input">Search</label>
    <input
      #searchBox
      id="user-search-input"
      type="search"
      class="user-list__search-input"
      placeholder="Search users…"
      [value]="searchTerm()"
      (keyup.enter)="onSearch(searchBox.value, typeSelect.value)"
    />
    <select
      #typeSelect
      class="user-list__search-type"
      aria-label="Search field"
      [value]="searchType()"
    >
      @for (option of searchFields; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
    <button
      type="button"
      class="user-list__search-btn"
      (click)="onSearch(searchBox.value, typeSelect.value)"
    >
      Search
    </button>
    @if (searchTerm()) {
      <button type="button" class="user-list__clear-btn" (click)="onClearSearch()">Clear</button>
    }
  </div>

  <div class="user-list__content">
    <app-loading-spinner [loading]="loading()" [overlay]="true" message="Loading users…" />

    <!-- MIGRATION: legacy <asp:DataGrid id="grdUsers"> -> reusable app-data-table.
         [filterable]="false" because search is server-driven via the toolbar above;
         client-side sort/paging remain enabled. -->
    <app-data-table
      [data]="rows()"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading()"
      [filterable]="false"
      [rowKey]="rowKey"
      caption="Users"
      emptyMessage="No users found."
      (rowAction)="onRowAction($event)"
    />
  </div>

  <!-- MIGRATION: legacy Delete image-command performed an immediate postback delete.
       Now a confirmation dialog gates DELETE /api/users/{id}. -->
  <app-confirmation-dialog
    [open]="confirmOpen()"
    (openChange)="confirmOpen.set($event)"
    title="Delete User"
    [message]="deleteMessage()"
    confirmLabel="Delete"
    cancelLabel="Cancel"
    [danger]="true"
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()"
  />
</section>
