<div class="change-password">
  <div class="change-password__card">
    <h1 class="change-password__title">Change Password</h1>

    <!-- MIGRATION: legacy PasswordUpdateStatus.PasswordResetFailed / provider errors surfaced from the
         RFC 7807 ProblemDetails rethrown by ApiService. -->
    @if (errorMessage(); as message) {
      <p class="change-password__error" role="alert">{{ message }}</p>
    }

    <!-- MIGRATION: legacy pnlChange panel + cmdUpdate (causesvalidation="True"). Postback eliminated;
         submission is a stateless HTTP call via (ngSubmit). -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <!-- MIGRATION: legacy row trOldPassword / txtOldPassword ("Old Password:"). appAutofocus + appValidationHighlight
           are applied INSIDE FormFieldComponent; autofocus the first field via [autofocus]. -->
      <app-form-field
        [control]="form.controls.oldPassword"
        controlType="password"
        label="Old Password"
        controlId="change-password-old"
        autocomplete="current-password"
        [required]="true"
        [autofocus]="true"
        [errorMessages]="oldPasswordErrorMessages"
      />

      <!-- MIGRATION: legacy txtNewPassword ("New Password:") + UserController.ValidatePassword. -->
      <app-form-field
        [control]="form.controls.newPassword"
        controlType="password"
        label="New Password"
        controlId="change-password-new"
        autocomplete="new-password"
        hint="Use at least 7 characters."
        [required]="true"
        [errorMessages]="newPasswordErrorMessages"
      />

      <!-- MIGRATION: legacy txtNewConfirm ("Confirm New Password:"). -->
      <app-form-field
        [control]="form.controls.confirmNewPassword"
        controlType="password"
        label="Confirm New Password"
        controlId="change-password-confirm"
        autocomplete="new-password"
        [required]="true"
        [errorMessages]="confirmNewPasswordErrorMessages"
      />

      <!-- MIGRATION: legacy PasswordMismatch (txtNewPassword <> txtNewConfirm). FormGroup-level cross-field
           error — FormFieldComponent only renders per-control errors, so it is shown here. -->
      @if (showMismatchError()) {
        <p class="change-password__field-error" role="alert">
          The new password and confirmation do not match.
        </p>
      }

      <!-- MIGRATION: legacy PasswordNotDifferent (new password = old password). -->
      @if (showNotDifferentError()) {
        <p class="change-password__field-error" role="alert">
          The new password must be different from your current password.
        </p>
      }

      <div class="change-password__actions">
        <button type="submit" class="change-password__submit" [disabled]="submitting()">
          Change Password
        </button>
      </div>
    </form>

    <!-- MIGRATION: legacy postback "please wait" affordance -> explicit busy overlay (Signals). -->
    <app-loading-spinner [loading]="submitting()" [overlay]="true" message="Updating password…" />
  </div>
</div>
