<!--
  MIGRATION: Website/admin/Users/Password.ascx `pnlChange` panel -> this standalone Angular view.
  Postback/ViewState/IClientAPICallback (AAP §0.6.3) are eliminated: the legacy <asp:textbox> rows
  (txtOldPassword/txtNewPassword/txtNewConfirm) become reusable <app-form-field> password controls, and
  the "Change Password" <dnn:commandbutton> (cmdUpdate) becomes a native submit button that triggers a
  stateless HTTP call. The secondary legacy panels `pnlReset` and `pnlQA` are intentionally NOT rendered
  here (see the component's MIGRATION notes).
-->
<section class="change-password">
  <!-- MIGRATION: legacy pnlChange heading label lblChangeHeading (resourcekey="ChangePassword"). -->
  <h1 class="change-password__title">Change Password</h1>

  <!--
    ReactiveFormsModule is exercised by [formGroup] + (ngSubmit); `novalidate` suppresses the native
    browser bubbles so the migrated per-field / cross-field messages are the single source of feedback.
  -->
  <form
    class="change-password__form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    novalidate
  >
    <!--
      MIGRATION: legacy txtOldPassword ("Old Password:"). First field receives [autofocus]="true"; the
      autofocus is applied by FormFieldComponent's OWN internal appAutofocus directive (not imported here).
    -->
    <app-form-field
      controlId="change-password-old"
      controlType="password"
      label="Old Password"
      [control]="form.controls.oldPassword"
      [required]="true"
      [autofocus]="true"
      [errorMessages]="oldPasswordErrorMessages"
    />

    <!-- MIGRATION: legacy txtNewPassword ("New Password:") + UserController.ValidatePassword (backend authority). -->
    <app-form-field
      controlId="change-password-new"
      controlType="password"
      label="New Password"
      [control]="form.controls.newPassword"
      [required]="true"
      [errorMessages]="newPasswordErrorMessages"
    />

    <!-- MIGRATION: legacy txtNewConfirm ("Confirm New Password:"). -->
    <app-form-field
      controlId="change-password-confirm"
      controlType="password"
      label="Confirm New Password"
      [control]="form.controls.confirmNewPassword"
      [required]="true"
      [errorMessages]="confirmNewPasswordErrorMessages"
    />

    <!--
      Cross-field (FormGroup-level) messages. FormFieldComponent only renders per-control errors, so the
      migrated PasswordMismatch / PasswordNotDifferent feedback is rendered HERE, gated by the OnPush
      computed display flags for correct change detection.
    -->
    @if (showMismatchError()) {
      <!-- MIGRATION: legacy PasswordUpdateStatus.PasswordMismatch (txtNewPassword <> txtNewConfirm). -->
      <p class="change-password__error" role="alert">
        The new password and confirmation do not match.
      </p>
    }

    @if (showNotDifferentError()) {
      <!-- MIGRATION: legacy PasswordUpdateStatus.PasswordNotDifferent (new = old). -->
      <p class="change-password__error" role="alert">
        Your new password must be different from your current password.
      </p>
    }

    <!-- MIGRATION: legacy PasswordUpdateStatus.PasswordResetFailed — server-reported failure feedback. -->
    @if (errorMessage()) {
      <p class="change-password__error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="change-password__actions">
      <!-- MIGRATION: legacy cmdUpdate ("Change Password") <dnn:commandbutton>. -->
      <button type="submit" class="change-password__submit" [disabled]="submitting()">
        Change Password
      </button>
    </div>

    <!--
      MIGRATION: the legacy synchronous postback "please wait" affordance becomes an explicit, feature-owned
      busy indicator bound to the `submitting` signal (renders nothing while idle).
    -->
    <app-loading-spinner [loading]="submitting()" message="Changing password…" />
  </form>
</section>
