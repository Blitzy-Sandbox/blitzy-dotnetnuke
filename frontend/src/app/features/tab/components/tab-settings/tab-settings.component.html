<section class="tab-settings" aria-labelledby="tab-settings-heading">
  <header class="tab-settings__header">
    <h1 id="tab-settings-heading" class="tab-settings__heading">Page Settings</h1>
    @if (pageName(); as name) {
      <p class="tab-settings__context">{{ name }}</p>
    }
  </header>

  @if (loadError(); as message) {
    <p class="tab-settings__alert" role="alert">{{ message }}</p>
  }

  @if (saved()) {
    <p class="tab-settings__saved" role="status">Settings saved.</p>
  }

  @if (loading()) {
    <app-loading-spinner [loading]="true" message="Loading settings..." />
  } @else if (!loadError()) {
    <form class="tab-settings__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="tab-settings__check">
        <input id="isVisible" class="tab-settings__checkbox" type="checkbox" formControlName="isVisible" />
        <label class="tab-settings__check-label" for="isVisible">Visible in navigation</label>
      </div>

      <div class="tab-settings__check">
        <input id="isSecure" class="tab-settings__checkbox" type="checkbox" formControlName="isSecure" />
        <label class="tab-settings__check-label" for="isSecure">Requires secure (HTTPS) connection</label>
      </div>

      <app-form-controls
        [control]="controls.iconFile"
        controlId="iconFile"
        label="Icon"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.skinSrc"
        controlId="skinSrc"
        label="Skin"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.containerSrc"
        controlId="containerSrc"
        label="Container"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.refreshInterval"
        controlId="refreshInterval"
        label="Refresh Interval (seconds)"
        type="number"
        [messages]="refreshIntervalMessages"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.startDate"
        controlId="startDate"
        label="Start Date"
        type="date"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.endDate"
        controlId="endDate"
        label="End Date"
        type="date"
        [serverErrors]="serverErrors()"
      />

      <div class="tab-settings__actions">
        @if (saving()) {
          <app-loading-spinner [loading]="true" message="Saving..." [diameter]="20" />
        }

        <button
          *appHasPermission="'EDIT'"
          type="submit"
          class="tab-settings__button tab-settings__button--primary"
          [disabled]="saving()"
        >
          Save Settings
        </button>

        <button type="button" class="tab-settings__button" [disabled]="saving()" (click)="onCancel()">
          Cancel
        </button>
      </div>
    </form>
  }
</section>
