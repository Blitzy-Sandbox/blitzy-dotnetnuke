<section class="tab-form" aria-labelledby="tab-form-heading">
  <header class="tab-form__header">
    <h1 id="tab-form-heading" class="tab-form__heading">{{ heading() }}</h1>
  </header>

  @if (loadError(); as message) {
    <p class="tab-form__alert" role="alert">{{ message }}</p>
  }

  @if (loadingTab()) {
    <app-loading-spinner [loading]="true" message="Loading page..." />
  } @else {
    <form class="tab-form__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <app-form-controls
        [control]="controls.tabName"
        controlId="tabName"
        label="Page Name"
        type="text"
        [autofocus]="true"
        [messages]="tabNameMessages"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.title"
        controlId="title"
        label="Title"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.description"
        controlId="description"
        label="Description"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.keyWords"
        controlId="keyWords"
        label="Keywords"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.url"
        controlId="url"
        label="URL"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.parentId"
        controlId="parentId"
        label="Parent Page Id"
        type="number"
        placeholder="(none = top-level)"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.tabOrder"
        controlId="tabOrder"
        label="Order"
        type="number"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.refreshInterval"
        controlId="refreshInterval"
        label="Refresh Interval (seconds)"
        type="number"
        [messages]="refreshIntervalMessages"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.iconFile"
        controlId="iconFile"
        label="Icon"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.skinSrc"
        controlId="skinSrc"
        label="Skin"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.containerSrc"
        controlId="containerSrc"
        label="Container"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.startDate"
        controlId="startDate"
        label="Start Date"
        type="date"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.endDate"
        controlId="endDate"
        label="End Date"
        type="date"
        [serverErrors]="serverErrors()"
      />

      <div class="tab-form__check">
        <input id="isVisible" class="tab-form__checkbox" type="checkbox" formControlName="isVisible" />
        <label class="tab-form__check-label" for="isVisible">Visible in navigation</label>
      </div>

      <div class="tab-form__check">
        <input id="isSecure" class="tab-form__checkbox" type="checkbox" formControlName="isSecure" />
        <label class="tab-form__check-label" for="isSecure">Requires secure (HTTPS) connection</label>
      </div>

      <div class="tab-form__actions">
        @if (submitting()) {
          <app-loading-spinner [loading]="true" message="Saving..." [diameter]="20" />
        }

        <button
          *appHasPermission="'EDIT'"
          type="submit"
          class="tab-form__button tab-form__button--primary"
          [disabled]="submitting()"
        >
          {{ isEditMode() ? 'Update Page' : 'Add Page' }}
        </button>

        @if (isEditMode()) {
          <button
            *appHasPermission="'DELETE'"
            type="button"
            class="tab-form__button tab-form__button--danger"
            [disabled]="submitting()"
            (click)="requestDelete()"
          >
            Delete
          </button>
        }

        <button type="button" class="tab-form__button" [disabled]="submitting()" (click)="cancel()">
          Cancel
        </button>
      </div>
    </form>
  }

  <app-confirmation-dialog
    [open]="showDeleteDialog()"
    title="Delete Page"
    message="Are you sure you want to delete this page? This action cannot be undone."
    confirmText="Delete"
    cancelText="Cancel"
    [destructive]="true"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  />
</section>
