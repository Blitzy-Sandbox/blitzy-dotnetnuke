<!--
  login.component.html — template for LoginComponent (app-login), the public JWT login page.

  MIGRATION: This UI is the brand-new entry point to the JWT Bearer authentication flow that
  REPLACES the legacy ASP.NET Forms Authentication + DES model in
  Library/Components/Security/PortalSecurity.vb (FormsAuthentication.SignOut L79;
  DES Encrypt/Decrypt L138-211). JWT + BCrypt is the single sanctioned behavior change of the
  migration (AAP §0.6.2); recorded in the root MIGRATION_NOTES.md. There is no legacy .ascx
  login control, so this markup is authored fresh.

  Angular 19 BUILT-IN control flow (@if/@else) is used deliberately: LoginComponent imports only
  [ReactiveFormsModule, FormControlsComponent, LoadingSpinnerComponent] — CommonModule is
  intentionally NOT imported — so *ngIf/*ngFor are unavailable. The two <app-form-controls>
  wrappers and the <app-loading-spinner> are the imported standalone dependencies, all used here.
  The shared <app-form-controls> renders its OWN <input>+<label>+inline errors (with
  aria-invalid/aria-describedby), so this template passes only the control + metadata and never
  hand-rolls an <input>.
-->
<section class="login__card" aria-labelledby="login-title">
  <h1 id="login-title" class="login__title">Sign in</h1>

  @if (errorMessage()) {
    <div class="login__error" role="alert">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-form-controls
      [control]="form.controls.username"
      controlId="username"
      label="Username"
      type="text"
      autocomplete="username"
      [autofocus]="true"
      [serverErrors]="serverErrors()"
      [messages]="usernameMessages"
    />

    <app-form-controls
      [control]="form.controls.password"
      controlId="password"
      label="Password"
      type="password"
      autocomplete="current-password"
      [serverErrors]="serverErrors()"
      [messages]="passwordMessages"
    />

    <div class="login__actions">
      <button type="submit" class="btn btn--primary login__submit" [disabled]="submitting()">
        @if (submitting()) {
          <app-loading-spinner [diameter]="20" message="Signing in…" />
          <span aria-hidden="true">Signing in…</span>
        } @else {
          Sign in
        }
      </button>
    </div>
  </form>
</section>
