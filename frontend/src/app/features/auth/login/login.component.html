<!-- MIGRATION: Angular re-expression of the legacy DNN portal Login control (the "Login" tab /
     Website/admin/Security login skin object backed by PortalSecurity.UserLogin). The Web Forms
     postback/ViewState login form is replaced by this PUBLIC standalone screen: a typed reactive form whose
     submit delegates to AuthService.login() (JWT Bearer + multi-tenant portalId), with the legacy
     account-locked / failure module messages re-expressed as the [errorMessage] alert. -->
<section class="login">
  <div class="login__card">
    <h1 class="login__title">Sign In</h1>

    @if (errorMessage(); as message) {
      <div class="login__error" role="alert">{{ message }}</div>
    }

    <form
      class="login__form"
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      <app-form-control label="Username" fieldKey="username" [errors]="fieldErrors()">
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          aria-required="true"
        />
      </app-form-control>

      <app-form-control label="Password" fieldKey="password" [errors]="fieldErrors()">
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          aria-required="true"
        />
      </app-form-control>

      <label class="login__remember">
        <input type="checkbox" formControlName="rememberMe" />
        <span>Remember Login</span>
      </label>

      <app-loading-spinner [loading]="submitting()" label="Signing in…" />

      <div class="login__actions">
        <!-- MIGRATION: [QA F3 #2b] Sign In now uses the canonical .btn .btn--primary system
             (src/styles.scss Section 6) for app-wide consistency; .login__submit is retained only
             as a layout hook for the full-width login button. -->
        <button type="submit" class="btn btn--primary login__submit" [disabled]="submitting()">
          Sign In
        </button>
      </div>

      <p class="login__links">
        <a routerLink="/auth/forgot-password">Forgot password?</a>
      </p>
    </form>
  </div>
</section>
