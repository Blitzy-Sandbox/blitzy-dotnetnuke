<section class="portal-form" aria-labelledby="portal-form-heading">
  <h1 id="portal-form-heading" class="portal-form__heading">{{ heading() }}</h1>

  @if (loading()) {
    <app-loading-spinner [loading]="true" message="Loading portal…" />
  } @else if (loadError()) {
    <!-- MIGRATION (QA Finding B): on edit-load failure the editable form is NOT rendered, so onSubmit can
         never fall through to the create (POST) branch and silently create a duplicate. The user sees the
         load error plus a Retry affordance instead. -->
    <div class="portal-form__error" role="alert">{{ loadError() }}</div>
    <div class="portal-form__actions">
      <button type="button" class="btn btn--primary" (click)="retryLoad()">Retry</button>
    </div>
  } @else {
    <form class="portal-form__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      @if (guid(); as portalGuid) {
        <div class="portal-form__readonly">
          <span class="portal-form__readonly-label">GUID</span>
          <code class="portal-form__readonly-value">{{ portalGuid }}</code>
        </div>
      }

      <app-form-controls
        [control]="controls.portalName"
        controlId="portalName"
        label="Portal Name"
        type="text"
        [autofocus]="true"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.description"
        controlId="description"
        label="Description"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.keyWords"
        controlId="keyWords"
        label="Keywords"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.logoFile"
        controlId="logoFile"
        label="Logo"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.backgroundFile"
        controlId="backgroundFile"
        label="Background"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.footerText"
        controlId="footerText"
        label="Footer Text"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.userRegistration"
        controlId="userRegistration"
        label="User Registration"
        type="number"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.bannerAdvertising"
        controlId="bannerAdvertising"
        label="Banner Advertising"
        type="number"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.currency"
        controlId="currency"
        label="Currency"
        type="text"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.administratorId"
        controlId="administratorId"
        label="Administrator"
        type="number"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.expiryDate"
        controlId="expiryDate"
        label="Expiry Date"
        type="date"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.splashTabId"
        controlId="splashTabId"
        label="Splash Page"
        type="number"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.homeTabId"
        controlId="homeTabId"
        label="Home Page"
        type="number"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.loginTabId"
        controlId="loginTabId"
        label="Login Page"
        type="number"
        [serverErrors]="serverErrors()"
      />

      <app-form-controls
        [control]="controls.userTabId"
        controlId="userTabId"
        label="User Profile Page"
        type="number"
        [serverErrors]="serverErrors()"
      />

      @if (submitError(); as message) {
        <!-- MIGRATION (QA Finding A): general save-failure banner (503/500/network errors with no field
             `errors` map). Field-level FluentValidation 400s still render inline via app-form-controls. -->
        <div class="portal-form__error" role="alert">{{ message }}</div>
      }

      <div class="portal-form__actions">
        <button
          *appHasPermission="'EDIT'"
          type="submit"
          class="btn btn--primary"
          [disabled]="saving()"
        >
          {{ isEditMode() ? 'Save Changes' : 'Create Portal' }}
        </button>
        <!-- MIGRATION (QA F4 Finding #2): Cancel/back affordance for parity with the sibling
             portal-settings, user-form, role-form and module-settings forms. Ungated (anyone who
             reached the form may abandon it) and routes back to the portal list, mirroring onSaveSuccess. -->
        <button type="button" class="btn btn--secondary" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  }
</section>
