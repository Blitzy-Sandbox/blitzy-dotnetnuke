<!-- =============================================================================
     FormControlsComponent template
     -----------------------------------------------------------------------------
     Label + input + validation-messages primitive. Uses only Angular built-in
     control flow (@if / @for) and the reactive-forms `[formControl]` binding, so
     the standalone component only imports ReactiveFormsModule. Class hooks match
     form-controls.component.scss exactly and must not be renamed.

     Accessibility:
       • The label is associated with the input via `for`/`id` (controlId).
       • `aria-invalid` reflects the validity state for assistive technology.
       • When errors are shown, the input points to them with `aria-describedby`
         and the error region uses role="alert" + aria-live="polite" so screen
         readers announce validation feedback.
     ============================================================================= -->
<label class="form-controls__label" [attr.for]="controlId()">{{ label() }}</label>

<input
  class="form-controls__input"
  [id]="controlId()"
  [type]="type()"
  [formControl]="control()"
  [placeholder]="placeholder()"
  [class.is-invalid]="isInvalid"
  [class.is-valid]="isValid"
  [attr.aria-invalid]="isInvalid"
  [attr.aria-describedby]="showErrors ? errorsId : null"
/>

@if (showErrors) {
  <div class="form-controls__errors" [id]="errorsId" role="alert" aria-live="polite">
    @for (message of allErrorMessages; track message) {
      <p class="form-controls__error">{{ message }}</p>
    }
  </div>
}
