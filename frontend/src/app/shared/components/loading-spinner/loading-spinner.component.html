@if (loading()) {
  <div class="loading-spinner" role="status" aria-live="polite" aria-busy="true">
    <svg
      class="loading-spinner__svg"
      [style.width.px]="diameter()"
      [style.height.px]="diameter()"
      viewBox="0 0 50 50"
      aria-hidden="true"
      focusable="false"
    >
      <circle class="loading-spinner__track" cx="25" cy="25" r="20" fill="none" stroke-width="5" />
      <circle class="loading-spinner__indicator" cx="25" cy="25" r="20" fill="none" stroke-width="5" />
    </svg>
    <span class="loading-spinner__label">{{ message() }}</span>
  </div>
}
